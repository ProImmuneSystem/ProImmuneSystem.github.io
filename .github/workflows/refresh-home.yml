name: Refresh homepage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-home.yml']
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-homepage
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch current homepage
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url = 'https://proimmunesystem.github.io/Immune-System/'
          request = urllib.request.Request(url, headers={'User-Agent': 'ImmuneNews-Homepage-Sync/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              body = response.read().decode('utf-8')
          if 'naver-site-verification' not in body or 'class="home-grid"' not in body or '/Immune-System/' not in body:
              raise SystemExit('Unexpected homepage content; refusing to deploy')
          Path('index.html').write_text(body, encoding='utf-8')
          PY
      - name: Save updated homepage
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update homepage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare site files
        run: |
          mkdir -p _publish
          cp index.html robots.txt _publish/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
